# Disabled at startup; review inputs and qualify devices before enabling.
blueprint:
  name: SleepyPod — Room PM2.5 review
  description: Create or update one local Home Assistant notification when a fresh source measurement
    is outside the selected review band. Withdraw it when the value recovers, expires, or becomes unavailable.
    This is a review prompt, not medical advice or automatic appliance control. Diffuser power and purifier
    fan capabilities must be qualified separately. Starts disabled.
  domain: automation
  homeassistant:
    min_version: 2026.10.0
  input:
    allow_actions:
      name: Allow local review notifications
      selector:
        boolean: {}
      default: false
      description: Leave off until you review the selected devices and qualify the sensors. It is checked
        inside actions too; Run actions cannot bypass it. The automation also starts disabled after every
        reload/restart.
    sensor:
      name: Room sensor
      selector:
        entity:
          filter:
            domain: sensor
            device_class: pm25
    timestamp_attribute:
      name: Source measurement timestamp attribute
      selector:
        text: {}
      description: 'Required: verify this attribute advances on actual measurements, including unchanged
        values. Never enter last_changed, last_updated, last_reported, or a clock generated by Home Assistant.'
    timestamp_format:
      name: Source timestamp format
      selector:
        select:
          options:
          - iso8601
          - unix_seconds
          - unix_milliseconds
      default: iso8601
    maximum_age:
      name: Maximum measurement age
      selector:
        number:
          min: 30
          max: 900
          unit_of_measurement: s
          mode: box
      default: 120
    lower:
      name: Lower review threshold
      selector:
        number:
          min: 0
          max: 1000
          unit_of_measurement: µg/m³
          mode: box
      default: 0
    upper:
      name: Upper review threshold
      selector:
        number:
          min: 0
          max: 1000
          unit_of_measurement: µg/m³
          mode: box
      default: 15
initial_state: false
mode: single
max_exceeded: silent
variables:
  allow_actions: !input 'allow_actions'
  sensor: !input 'sensor'
  timestamp_attribute: !input 'timestamp_attribute'
  timestamp_format: !input 'timestamp_format'
  maximum_age: !input 'maximum_age'
  lower: !input 'lower'
  upper: !input 'upper'
  reading: '{{ states(sensor) | float(none) }}'
  measured_at: |-
    {% set raw = state_attr(sensor, timestamp_attribute) %}
    {% if timestamp_attribute in ['last_changed', 'last_updated', 'last_reported'] %}
      {{ none }}
    {% elif timestamp_format == 'iso8601' and raw is string %}
      {{ as_timestamp(raw, none) }}
    {% elif timestamp_format in ['unix_seconds', 'unix_milliseconds'] and raw is number and raw is not boolean %}
      {{ raw / 1000 if timestamp_format == 'unix_milliseconds' else raw }}
    {% else %}
      {{ none }}
    {% endif %}
  fresh: |-
    {{ has_value(sensor) and reading is number and reading is not boolean
       and 0 <= reading <= 1000 and state_attr(sensor, 'unit_of_measurement') == 'µg/m³'
       and measured_at is number and measured_at is not boolean
       and maximum_age is number and 30 <= maximum_age <= 900
       and 0 <= now().timestamp() - measured_at < maximum_age
       and 0 <= lower < upper <= 1000 }}
  notification_id: '{{ ''sleepypod_room_'' ~ this.entity_id }}'
triggers:
- trigger: state
  entity_id: !input 'sensor'
- trigger: time_pattern
  seconds: /30
conditions:
- condition: template
  value_template: '{{ allow_actions is sameas true }}'
actions:
- condition: template
  value_template: '{{ allow_actions is sameas true }}'
- choose:
  - conditions:
    - condition: template
      value_template: '{{ fresh and (reading < lower or reading > upper) }}'
    sequence:
    - action: persistent_notification.create
      data:
        notification_id: '{{ notification_id }}'
        title: Room PM2.5 review
        message: |-
          Room reading: {{ reading }} µg/m³. Review band: {{ lower }}–{{ upper }} µg/m³.
          Source measurement: {{ measured_at | timestamp_local }}.
          This proposal expires after {{ maximum_age }} seconds without a new source sample; the next 30-second check withdraws it. No appliance or Pod command was sent.
  default:
  - action: persistent_notification.dismiss
    data:
      notification_id: '{{ notification_id }}'
