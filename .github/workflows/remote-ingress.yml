name: Remote ingress

on:
  pull_request:
    paths:
      - 'scripts/remote_ingress/**'
      - 'docs/remote-ingress.md'
      - '.github/workflows/remote-ingress.yml'
      - 'src/auth/**'
      - 'src/connections/**'
      - 'src/household/**'
      - 'app/api/auth/session/**'
      - 'app/api/v1/connection/**'
      - 'proxy.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remote-ingress-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  transport:
    name: Core ingress transport
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install local test proxy
        run: sudo apt-get update && sudo apt-get install --yes nginx
      - name: Verify actual proxy behavior
        run: NGINX_BIN=/usr/sbin/nginx python3 scripts/remote_ingress/test_ingress.py -v
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
      - name: Install locked handler dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify Core account authorization through ingress
        run: NGINX_BIN=/usr/sbin/nginx pnpm exec vitest run --config scripts/remote_ingress/vitest.config.mts
