name: CI

on:
  push:
    branches: [dev]
  pull_request:
    types: [opened, synchronize, reopened]
  # Merge queue: the required checks must also report on the temporary
  # merge-group branch or every queue entry fails.
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ${{ matrix.task.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        task:
          - { name: "Lint", cmd: "CHANGED=$(git diff --name-only --diff-filter=d origin/${BASE_REF#refs/heads/}...HEAD -- '*.ts' '*.tsx' | head -200); if [ -n \"$CHANGED\" ]; then echo \"$CHANGED\" | xargs -d '\\n' pnpm eslint --; else echo 'No TS/TSX files changed'; fi" }
          - { name: "Typecheck", cmd: "pnpm tsc" }
          - { name: "Unit Tests", cmd: "pnpm test run --coverage --passWithNoTests" }

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
          registry-url: 'https://npm.pkg.github.com'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Assets (Vitest)
        id: asset-cache
        uses: actions/cache@v5
        with:
          path: |
            .vitest
          key: assets-${{ runner.os }}-${{ hashFiles('src/db/schema.ts', 'vitest.config.ts') }}

      - name: Run Task
        run: ${{ matrix.task.cmd }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_ENV: test
          # A PR carries base.ref; a merge-group run carries refs/heads/<base>.
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.merge_group.base_ref }}

      - name: Upload coverage reports to Codecov
        if: matrix.task.name == 'Unit Tests' && !cancelled()
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          fail_ci_if_error: false
          slug: sleepypod/core
          flags: javascript

      - name: Upload test results to Codecov
        if: matrix.task.name == 'Unit Tests' && !cancelled()
        uses: codecov/codecov-action@v5
        with:
          report_type: test_results
          use_oidc: true
          fail_ci_if_error: false
          slug: sleepypod/core
          files: test-results/junit.xml
          flags: javascript