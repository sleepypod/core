name: Branch Release Cleanup

# Drop a deleted feature branch's asset from the shared `branch-builds`
# prerelease, plus its pre-consolidation `<slug>-latest` release if one is
# still around.

on:
  delete:

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.ref_type == 'branch' && github.event.ref != 'main' && github.event.ref != 'dev'
    runs-on: ubuntu-latest
    steps:
      - name: Compute tag
        id: slug
        run: |
          REF="${{ github.event.ref }}"
          SLUG="${REF//\//-}"
          echo "tag=${SLUG}-latest" >> "$GITHUB_OUTPUT"
          echo "asset=sleepypod-core--${SLUG}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Drop branch build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.slug.outputs.tag }}"
          # Idempotent — 404 (branch never had a build) is fine.
          gh release delete-asset branch-builds "${{ steps.slug.outputs.asset }}" --yes --repo "${{ github.repository }}" 2>/dev/null || true
          gh release delete "$TAG" --yes --cleanup-tag --repo "${{ github.repository }}" 2>/dev/null || true
