name: Publish OpenAPI Spec

on:
  push:
    branches: [main, dev]
  pull_request:
    paths:
      - '.github/workflows/openapi.yml'
      - 'app/api/openapi.json/**'
      - 'src/server/openapi.ts'
      - 'src/auth/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-spec:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Exercise the same authenticated route as a real client without using
      # any owner's credentials or weakening production authentication.
      - name: Create temporary export credential
        run: |
          export_token=$(openssl rand -hex 32)
          echo "::add-mask::$export_token"
          printf 'SLEEPYPOD_AUTH_TOKEN=%s\n' "$export_token" >> "$GITHUB_ENV"

      - name: Start server
        run: |
          mkdir -p /tmp/sleepypod-raw
          pnpm start --hostname 127.0.0.1 > /tmp/server.log 2>&1 &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"
        env:
          DATABASE_URL: file:./ci-sleepypod.db
          BIOMETRICS_DATABASE_URL: file:./ci-biometrics.db
          RAW_DATA_DIR: /tmp/sleepypod-raw
          DAC_SOCK_PATH: /tmp/nonexistent-dac.sock

      - name: Wait for server
        run: |
          for i in $(seq 1 90); do
            if curl -sf --max-time 5 -H "Authorization: Bearer $SLEEPYPOD_AUTH_TOKEN" \
              http://127.0.0.1:3000/api/openapi.json > /dev/null 2>&1; then
              echo "Server ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to start within 90s"
          echo "--- Server log ---"
          cat /tmp/server.log
          exit 1

      - name: Download OpenAPI spec
        run: |
          curl -sf --max-time 30 -H "Authorization: Bearer $SLEEPYPOD_AUTH_TOKEN" \
            http://127.0.0.1:3000/api/openapi.json | jq . > openapi.json
          jq -e '.openapi and .paths and .security' openapi.json > /dev/null

      - name: Verify anonymous access stays blocked
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 \
            http://127.0.0.1:3000/api/openapi.json)
          test "$status" = 401

      - name: Stop server
        if: always()
        run: kill "$SERVER_PID" 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.ref_name == 'main' && 'openapi' || 'openapi-dev' }}
          path: openapi.json
          retention-days: 90
